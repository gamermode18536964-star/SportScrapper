name: Fetch Data & Deploy

on:
  schedule:
    - cron: '0 15 * * *'   # 10 AM ET (UTC-5 standard / UTC-4 daylight — adjust to '0 14 * * *' during EDT)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --break-system-packages playwright beautifulsoup4
          playwright install chromium

      - name: Fetch data
        env:
          KS_EMAIL:    ${{ secrets.KS_EMAIL }}
          KS_PASSWORD: ${{ secrets.KS_PASSWORD }}
        run: |
          python - <<'PYEOF'
          import asyncio, json, os, re, time
          from datetime import datetime, timezone
          from playwright.async_api import async_playwright
          from bs4 import BeautifulSoup

          SOURCES = {
              "saved": {
                  "url": "https://killersports.com/saved-trend-alerts?filter={sport}",
                  "skip": ["No Trends to Show"],
                  "filters": {
                      "mlb":"MLB","wnba":"WNBA","nfl":"NFL",
                      "nba":"NBA","nhl":"NHL","ncaaf":"NCAAFB","ncaab":"NCAABB"
                  }
              },
              "ai": {
                  "url": "https://killersports.com/trend-ware-matchup2?filter={sport}",
                  "skip": ["Vault Empty"],
                  "filters": {
                      "mlb":"MLB","wnba":"WNBA","nfl":"NFL",
                      "nba":"NBA","nhl":"NHL","ncaaf":"NCAAFB","ncaab":"NCAABB"
                  }
              },
              "kspro": {
                  "url": "https://killersports.com/ks-pro-alerts?filter={sport}",
                  "skip": ["No Indicators to Show"],
                  "filters": {
                      "mlb":"MLB","wnba":"WNBA","nfl":"NFL",
                      "nba":"NBA","nhl":"NHL","ncaaf":"NCAAFB","ncaab":"NCAABB"
                  }
              }
          }

          def best_table(soup, skip_phrases):
              """
              Find the best data table on the page.
              Strategy:
                1. Skip tables that contain any skip phrase.
                2. Among remaining tables, pick the one with the most data rows (tr in tbody,
                   or tr count minus 1 for a header row if no tbody).
                3. Fall back to any table with > 0 rows if nothing else found.
              """
              tables = soup.find_all("table")
              print(f"  [DEBUG] Found {len(tables)} table(s) on page")

              candidates = []
              for i, t in enumerate(tables):
                  t_text = t.get_text()
                  # skip tables containing skip phrases
                  if any(ph.lower() in t_text.lower() for ph in skip_phrases):
                      print(f"  [DEBUG] Table {i}: skipped (contains skip phrase)")
                      continue

                  tbody = t.find("tbody")
                  if tbody:
                      rows = tbody.find_all("tr")
                  else:
                      rows = t.find_all("tr")
                      # subtract 1 for header row if no thead/tbody split
                      if t.find("thead") or (rows and rows[0].find("th")):
                          rows = rows[1:]

                  print(f"  [DEBUG] Table {i} id={t.get('id','')} class={t.get('class','')} data_rows={len(rows)}")
                  if len(rows) > 0:
                      candidates.append((len(rows), i, t))

              if not candidates:
                  return None
              candidates.sort(key=lambda x: x[0], reverse=True)
              return candidates[0][2]

          def extract_headers(table):
              """
              Extract column headers from a table.
              Tries thead first, then first row of tbody, then first tr anywhere.
              """
              thead = table.find("thead")
              if thead:
                  # Some sites put multiple header rows; use the last one (most detailed)
                  header_rows = thead.find_all("tr")
                  if header_rows:
                      cells = header_rows[-1].find_all(["th", "td"])
                      headers = [c.get_text(strip=True) for c in cells]
                      print(f"  [DEBUG] Headers from thead: {headers}")
                      return headers

              # Fall back: first row of the table that has th cells
              for row in table.find_all("tr"):
                  cells = row.find_all("th")
                  if cells:
                      headers = [c.get_text(strip=True) for c in cells]
                      print(f"  [DEBUG] Headers from th row: {headers}")
                      return headers

              # Last resort: treat first tr as headers
              first_row = table.find("tr")
              if first_row:
                  cells = first_row.find_all(["th", "td"])
                  headers = [c.get_text(strip=True) for c in cells]
                  print(f"  [DEBUG] Headers from first tr: {headers}")
                  return headers

              return []

          def extract_rows(table, headers):
              """
              Extract data rows. Uses tbody if present, otherwise all tr after the header row.
              Pads/trims each row to match header count.
              """
              tbody = table.find("tbody")
              if tbody:
                  trs = tbody.find_all("tr")
              else:
                  all_trs = table.find_all("tr")
                  # skip the first tr if it was our header
                  trs = all_trs[1:] if all_trs else []

              rows = []
              for tr in trs:
                  cells = tr.find_all(["td", "th"])
                  row = [c.get_text(strip=True) for c in cells]
                  if not any(row):
                      continue
                  # Pad or trim to match header length
                  while len(row) < len(headers):
                      row.append("")
                  row = row[:len(headers)]
                  rows.append(row)

              print(f"  [DEBUG] Extracted {len(rows)} data rows")
              if rows:
                  print(f"  [DEBUG] First row sample: {rows[0]}")
              return rows

          async def scrape(page, url, skip_phrases, label):
              print(f"\n--- Scraping {label}: {url} ---")
              try:
                  await page.goto(url, wait_until="networkidle", timeout=60000)
                  await asyncio.sleep(3)
                  html = await page.content()
                  soup = BeautifulSoup(html, "html.parser")

                  # Check skip phrases in full page text
                  page_text = soup.get_text()
                  for phrase in skip_phrases:
                      if phrase.lower() in page_text.lower():
                          print(f"  [INFO] Skip phrase found: '{phrase}' — returning empty")
                          return None

                  table = best_table(soup, skip_phrases)
                  if table is None:
                      print(f"  [WARN] No suitable table found for {label}")
                      # Debug: print page title and snippet
                      title = soup.find("title")
                      print(f"  [DEBUG] Page title: {title.get_text() if title else 'N/A'}")
                      print(f"  [DEBUG] Page text snippet: {page_text[:500]}")
                      return None

                  headers = extract_headers(table)
                  if not headers:
                      print(f"  [WARN] Could not extract headers for {label}")
                      return None

                  rows = extract_rows(table, headers)
                  if not rows:
                      print(f"  [INFO] Table found but no data rows for {label}")
                      return None

                  print(f"  [OK] {label}: {len(headers)} cols, {len(rows)} rows")
                  return {"headers": headers, "rows": rows}

              except Exception as e:
                  print(f"  [ERROR] {label}: {e}")
                  return None

          def merge(existing, fresh):
              if fresh is None:
                  return existing
              if not fresh.get("rows"):
                  return existing
              if not existing or not existing.get("rows"):
                  return fresh
              today_labels = set(r[0] for r in fresh["rows"] if r[0] and r[0] != "@")
              kept, skip = [], False
              for row in existing["rows"]:
                  if row[0] and row[0] != "@":
                      skip = row[0] in today_labels
                  if not skip:
                      kept.append(row)
              return {"headers": fresh["headers"], "rows": kept + fresh["rows"]}

          async def main():
              email    = os.environ["KS_EMAIL"]
              password = os.environ["KS_PASSWORD"]

              # Load existing data
              existing = {}
              try:
                  with open("data.json") as f:
                      existing = json.load(f)
                  print("Loaded existing data.json")
              except Exception:
                  print("No existing data.json — starting fresh")

              async with async_playwright() as pw:
                  browser = await pw.chromium.launch(headless=True)
                  context = await browser.new_context(
                      user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                                 "AppleWebKit/537.36 (KHTML, like Gecko) "
                                 "Chrome/124.0.0.0 Safari/537.36"
                  )
                  page = await context.new_page()

                  # ── Login ────────────────────────────────────────
                  print("\n=== Logging in ===")
                  await page.goto("https://killersports.com", wait_until="networkidle", timeout=60000)
                  await asyncio.sleep(2)

                  # Remove cookie consent overlay if present
                  await page.evaluate("document.getElementById('__abconsent-cmp')?.remove()")
                  await asyncio.sleep(0.5)

                  # Open login modal via jQuery
                  await page.evaluate("$('.modal-login').fadeIn()")
                  await asyncio.sleep(1)

                  # Fill credentials
                  await page.fill(".modal-login input[type='email'], .modal-login input[name='email']", email)
                  await page.fill(".modal-login input[type='password'], .modal-login input[name='password']", password)

                  # Remove overlay again before clicking (in case it reappeared)
                  await page.evaluate("document.getElementById('__abconsent-cmp')?.remove()")
                  await asyncio.sleep(0.3)

                  await page.click(".modal-login .button-primary")
                  await asyncio.sleep(3)
                  print("Login submitted")

                  # ── Scrape all sources/sports ─────────────────────
                  result = {
                      "updated": datetime.now(timezone.utc).isoformat(),
                      "saved": {},
                      "ai":    {},
                      "kspro": {}
                  }

                  for src_key, src_cfg in SOURCES.items():
                      for sport_key, sport_label in src_cfg["filters"].items():
                          url   = src_cfg["url"].replace("{sport}", sport_label)
                          label = f"{src_key}/{sport_key}"

                          fresh = await scrape(page, url, src_cfg["skip"], label)

                          prev = existing.get(src_key, {}).get(sport_key)
                          merged = merge(prev, fresh)
                          result[src_key][sport_key] = merged if merged else {"headers": [], "rows": []}

                  await browser.close()

              with open("data.json", "w") as f:
                  json.dump(result, f, separators=(",", ":"))
              print("\n=== data.json written ===")

          asyncio.run(main())
          PYEOF

      - name: Commit data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "chore: update data.json [skip ci]"
          git push https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
